name: Demo verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-public-source.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - run: dotnet run --project tests/HaninTaxi.Tests --configuration Release
      - run: node scripts/test-demo.mjs

  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [rider-app, driver-app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --no-pub

  operator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - run: npm ci
      - run: npm run audit
      - run: npm test
      - run: npm run build
        env:
          CI: "true"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
